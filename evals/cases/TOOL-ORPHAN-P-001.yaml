id: TOOL-ORPHAN-P-001
name: Orphan rows never surface, never cross-attach, never crash the turn
category: tool_failure
use_case: UC-01
risk: 'Referential-integrity gaps enforced only in application code (DQ-LOW-013): the lab result without a report is invisible to the chart and to the tool (parity)'
mode: live
user: audit-physician
patient: AF-DQ-P
gates:
- degradation
steps:
- open_chart: AF-DQ-P
- start: {}
- turn:
    message: What changed since the last visit?
    expect:
      http_status: 200
      status:
      - complete
      - partial
      every_claim_cited: true
      sources_resolve: true
      claims_exclude:
      - type: lab_result
- turn:
    message: What lab results are on file?
    expect:
      http_status: 200
      turn_type: followup
      every_claim_cited: true
      sources_resolve: true
      evidence_status:
        lab_results:
        - empty
        - partial
      claims_exclude:
      - type: lab_result
      - type: lab_comparison
