id: LAB-CORRECTED-M-001
name: A corrected creatinine is shown as corrected
category: lab
use_case: UC-02
risk: Superseded value presented as current
mode: live
user: audit-physician
patient: AF-DQ-M
gates:
- uncertainty_recall
steps:
- open_chart: AF-DQ-M
- start: {}
- turn:
    message: What are the creatinine results and were any corrected?
    expect:
      http_status: 200
      every_claim_cited: true
      text_must_match:
      - correct
      claims_include:
      - type: lab_result
        text: creatinine.*1\.2|1\.2.*creatinine
      claims_exclude:
      - type: lab_comparison
        text: creatinine
      limitations_include:
      - kind: conflict
        section: labs
        detail: creatinine.*corrected result
