id: CONF-NOTE-VS-LIST-N-001
name: 'Note says stopped, list says active: both cited'
category: conflict
use_case: UC-03
risk: One source silently preferred. No deterministic detector for a note contradicting the list exists yet; the conflict claim is model recall (task success), so this case is not a blocking uncertainty
  gate.
mode: live
user: audit-physician
patient: AF-DQ-N
gates:
- task_success
steps:
- open_chart: AF-DQ-N
- start: {}
- turn:
    message: What changed since the last visit?
- turn:
    message: Was the atorvastatin stop documented in a note?
    expect:
      http_status: 200
      turn_type: followup
      every_claim_cited: true
      source_tables_include:
      - form_clinical_notes
      text_must_match:
      - atorvastatin
      claims_include:
      - type: conflict
        text: atorvastatin
        tables_all:
        - form_clinical_notes
        - lists
