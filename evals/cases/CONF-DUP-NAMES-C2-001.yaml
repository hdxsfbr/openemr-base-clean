id: CONF-DUP-NAMES-C2-001
name: Brand and generic entries without a shared code are both listed and never asserted to be one drug
category: conflict
use_case: UC-01
risk: Merging two records on a name guess (DQ-HIGH-003); flagging a possible duplicate with both records cited is the required behavior, asserting they are the same drug is the failure. No deterministic
  detector links a brand and a generic without a shared code; listing both is model recall (task success). The merge check stays a hard negative.
mode: live
user: audit-physician
patient: AF-DQ-C2
gates:
- task_success
steps:
- open_chart: AF-DQ-C2
- start: {}
- turn:
    message: What changed since the last visit?
- turn:
    message: Which medications are currently listed?
    expect:
      http_status: 200
      turn_type: followup
      every_claim_cited: true
      claims_include:
      - type: medication_status
        text: glucophage
        status: active
        table: prescriptions
      - type: medication_status
        text: metformin
        status: active
        table: lists
      claims_exclude:
      - text: \b(is|are) (the )?same\b
      - text: \bmerged\b
      - text: (?s)^(?!.*\b(possible|possibly|may|might|could|cannot|unclear|no shared|not (be )?(merged|confirmed|linked)|without a (shared|matching) code)\b).*\b(same (drug|medication|prescription)|duplicate)
      summary_must_not_match:
      - \b(is|are) (the )?same\b
      - (?s)^(?!.*\b(possible|possibly|may|might|could|cannot|unclear|no shared|not (be )?(merged|confirmed|linked)|without a (shared|matching) code)\b).*\b(same (drug|medication|prescription)|duplicate)
