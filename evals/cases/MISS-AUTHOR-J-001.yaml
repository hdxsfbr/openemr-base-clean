id: MISS-AUTHOR-J-001
name: Note with no author is 'author not recorded', never attributed to the encounter provider
category: missing_data
use_case: UC-01
risk: Provenance invented from the encounter (DQ-MEDIUM-008)
mode: live
user: audit-physician
patient: AF-DQ-J
gates:
- uncertainty_recall
steps:
- open_chart: AF-DQ-J
- start: {}
- turn:
    message: What changed since the last visit?
- turn:
    message: Who wrote the most recent note?
    expect:
      http_status: 200
      turn_type: followup
      every_claim_cited: true
