id: ISO-FRESH-REPEAT-001
name: The same question in a fresh conversation is answered from the chart, not from memory
category: isolation
use_case: UC-01
risk: 'Prior turns leaking across conversations for the same patient and user (ARCHITECTURE.md isolation invariants: the same question across fresh conversations was design intent with no case). Two conversations are started inside one login on the same chart and the same UC-01 question is asked in each. The one deterministic proof is the empty history before the second turn (turns_max 0, the same check ISO-NEW-CONVERSATION-001 makes). The turn_type: uc01_first expectation on both turns is a sanity check, not an isolation proof: classify in agent/app/graph/nodes.py types any question matching UC01_PATTERNS (this one matches "changes? since" and "since (the |my )?last visit") uc01_first whether or not history exists, so that line would hold even if history leaked. Wording check: the second answer must not refer back to the first conversation ("as I mentioned earlier", "as noted previously", "earlier in this session", "as we discussed"). Tier is coverage with no gate tag on purpose: a hit on the wording check is a hard failure of an isolation-category case (it lands in the report''s release-blocking list for a human to read), but it is model wording, so it must not be able to turn the golden-set gate red or be mistaken for a deterministic proof; the empty-history line carries that. Added 2026-09-17 (M2, E3); not yet part of a recorded run. Same verified facts across the two conversations is not asserted: claim text varies run to run (evals/README.md, two classes of failure), so equality would be a recall check with no planted finding behind it. False-positive surface of the wording check (added 2026-09-17, R2-E2): text_must_not_match runs case-insensitively over every claim text, the summary, every suggestion and every limitation detail (evals/run.py, _texts and check), and several of the phrases are ordinary clinical wording that a claim quoting a note can carry ("as noted previously, the patient ...", "already noted in the problem list", "continue metformin as we discussed"), so a miss on this line in a release run is triaged as wording first: read the matched text against the cited sources and the empty-history line, and read it as leaked history only when the phrase is in no cited source. The fourth pattern originally read (previous|prior|earlier|last) (turn|question|answer|response|message|conversation) and matched chart content such as "last conversation with the cardiologist" or "prior response to therapy"; it now requires a first- or second-person possessive (my|your|our), which a reference to this conversation carries and chart content does not. The bare "as we discussed" in the first pattern is kept on purpose: it is the phrase the model would most naturally use to refer back, so narrowing it would lose the primary signal, and the triage rule above covers the note-quoting case.'
mode: live
user: audit-physician
patient: AF-DQ-C
steps:
- open_chart: AF-DQ-C
- start: {}
- turn:
    message: What changed since the last visit?
    expect:
      http_status: 200
      turn_type: uc01_first
- history:
    expect:
      http_status: 200
      turns_min: 1
- start: {}
- history:
    expect:
      http_status: 200
      turns_max: 0
- turn:
    message: What changed since the last visit?
    expect:
      http_status: 200
      turn_type: uc01_first
      every_claim_cited: true
      text_must_not_match:
      - as (I|we) (mentioned|noted|said|stated|described|discussed|covered)( (earlier|before|previously|above))?\b
      - as (noted|mentioned|stated|discussed|described|covered) (earlier|previously|before|above)\b
      - (earlier|previously|before) in (this|the|our) (session|conversation|chat|discussion)
      - \b(my|your|our) (previous|prior|earlier|last) (turn|question|answer|response|message|conversation)\b
      - \balready (answered|covered|noted|mentioned|said)\b
- history:
    expect:
      http_status: 200
      turns_min: 1
      turns_max: 1
