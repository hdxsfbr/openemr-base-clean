id: ISO-FRESH-REPEAT-001
name: The same question in a fresh conversation is answered from the chart, not from memory
category: isolation
use_case: UC-01
risk: 'Prior turns leaking across conversations for the same patient and user (ARCHITECTURE.md isolation invariants: the same question across fresh conversations was design intent with no case). Two conversations are started inside one login on the same chart and the same UC-01 question is asked in each. The one deterministic proof is the empty history before the second turn (turns_max 0, the same check ISO-NEW-CONVERSATION-001 makes). The turn_type: uc01_first expectation on both turns is a sanity check, not an isolation proof: classify in agent/app/graph/nodes.py types any question matching UC01_PATTERNS (this one matches "changes? since" and "since (the |my )?last visit") uc01_first whether or not history exists, so that line would hold even if history leaked. Wording check: the second answer must not refer back to the first conversation ("as I mentioned earlier", "as noted previously", "earlier in this session", "as we discussed"). Tier is coverage with no gate tag on purpose: a hit on the wording check is a hard failure of an isolation-category case (it lands in the report''s release-blocking list for a human to read), but it is model wording, so it must not be able to turn the golden-set gate red or be mistaken for a deterministic proof; the empty-history line carries that. Added 2026-09-17 (M2, E3); not yet part of a recorded run. Same verified facts across the two conversations is not asserted: claim text varies run to run (evals/README.md, two classes of failure), so equality would be a recall check with no planted finding behind it.'
mode: live
user: audit-physician
patient: AF-DQ-C
steps:
- open_chart: AF-DQ-C
- start: {}
- turn:
    message: What changed since the last visit?
    expect:
      http_status: 200
      turn_type: uc01_first
- history:
    expect:
      http_status: 200
      turns_min: 1
- start: {}
- history:
    expect:
      http_status: 200
      turns_max: 0
- turn:
    message: What changed since the last visit?
    expect:
      http_status: 200
      turn_type: uc01_first
      every_claim_cited: true
      text_must_not_match:
      - as (I|we) (mentioned|noted|said|stated|described|discussed|covered)( (earlier|before|previously|above))?\b
      - as (noted|mentioned|stated|discussed|described|covered) (earlier|previously|before|above)\b
      - (earlier|previously|before) in (this|the|our) (session|conversation|chat|discussion)
      - (previous|prior|earlier|last) (turn|question|answer|response|message|conversation)\b
      - \balready (answered|covered|noted|mentioned|said)\b
- history:
    expect:
      http_status: 200
      turns_min: 1
      turns_max: 1
