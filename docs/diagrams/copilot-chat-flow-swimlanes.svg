<svg width="680" height="1240" viewBox="0 0 680 1240" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Co-pilot chat flow swimlanes</title>
<desc>Five lanes: browser panel, module API, agent service, tool gateway, Claude. One question flows from the panel through the module's session, conversation, and ticket endpoints, then to the agent, which calls the tool gateway for chart records, calls Claude to narrate, verifies the claims, and streams the answer back to the panel.</desc>
<style>
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; dominant-baseline: central; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  .lg { font-size: 12px; font-weight: 400; text-anchor: start; fill: #5F5E5A; }
  .lane { fill: none; stroke: #B4B2A9; stroke-width: 0.5; stroke-dasharray: 4 4; }
  .arr { fill: none; stroke: #888780; stroke-width: 1; }
  .dash { stroke-dasharray: 4 3; }
  .gray rect { fill: #F1EFE8; stroke: #5F5E5A; } .gray .th { fill: #444441; } .gray .ts { fill: #5F5E5A; }
  .teal rect { fill: #E1F5EE; stroke: #0F6E56; } .teal .th { fill: #085041; } .teal .ts { fill: #0F6E56; }
  .purple rect { fill: #EEEDFE; stroke: #534AB7; } .purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }
  .coral rect { fill: #FAECE7; stroke: #993C1D; } .coral .th { fill: #712B13; } .coral .ts { fill: #993C1D; }
  .red rect { fill: #FCEBEB; stroke: #A32D2D; } .red .th { fill: #791F1F; } .red .ts { fill: #A32D2D; }
  g rect { stroke-width: 0.5; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="1240" fill="#FFFFFF"/>

<rect class="lane" x="30" y="30" width="104" height="1162" rx="8"/>
<rect class="lane" x="140" y="30" width="128" height="1162" rx="8"/>
<rect class="lane" x="274" y="30" width="128" height="1162" rx="8"/>
<rect class="lane" x="408" y="30" width="124" height="1162" rx="8"/>
<rect class="lane" x="538" y="30" width="100" height="1162" rx="8"/>

<g class="gray"><rect x="30" y="30" width="104" height="48" rx="8"/><text class="th" x="82" y="48">Browser</text><text class="ts" x="82" y="65">panel JS</text></g>
<g class="teal"><rect x="140" y="30" width="128" height="48" rx="8"/><text class="th" x="204" y="48">Module API</text><text class="ts" x="204" y="65">OpenEMR, session</text></g>
<g class="purple"><rect x="274" y="30" width="128" height="48" rx="8"/><text class="th" x="338" y="48">Agent service</text><text class="ts" x="338" y="65">Python, LangGraph</text></g>
<g class="teal"><rect x="408" y="30" width="124" height="48" rx="8"/><text class="th" x="470" y="48">Tool gateway</text><text class="ts" x="470" y="65">OpenEMR, token</text></g>
<g class="coral"><rect x="538" y="30" width="100" height="48" rx="8"/><text class="th" x="588" y="48">Claude</text><text class="ts" x="588" y="65">model API</text></g>

<g class="gray"><rect x="34" y="100" width="96" height="70" rx="8"/><text class="th" x="82" y="118">Question</text><text class="ts" x="82" y="140">first message</text><text class="ts" x="82" y="156">chart is open</text></g>
<polyline class="arr" points="82,170 82,177 204,177 204,184" marker-end="url(#arrow)"/>

<g class="teal"><rect x="144" y="184" width="120" height="70" rx="8"/><text class="th" x="204" y="202">Session check</text><text class="ts" x="204" y="224">session.php</text><text class="ts" x="204" y="240">chart open, CSRF</text></g>
<line class="arr" x1="204" y1="254" x2="204" y2="268" marker-end="url(#arrow)"/>

<g class="teal"><rect x="144" y="268" width="120" height="70" rx="8"/><text class="th" x="204" y="286">Conversation</text><text class="ts" x="204" y="308">conversation.php</text><text class="ts" x="204" y="324">bind user + pid</text></g>
<line class="arr" x1="204" y1="338" x2="204" y2="352" marker-end="url(#arrow)"/>

<g class="teal"><rect x="144" y="352" width="120" height="70" rx="8"/><text class="th" x="204" y="370">Turn ticket</text><text class="ts" x="204" y="392">ticket.php</text><text class="ts" x="204" y="408">90 s token</text></g>
<polyline class="arr" points="204,422 204,429 338,429 338,436" marker-end="url(#arrow)"/>
<polyline class="arr dash" points="204,429 82,429 82,436" marker-end="url(#arrow)"/>

<g class="red"><rect x="34" y="436" width="96" height="70" rx="8"/><text class="th" x="82" y="454">Denied</text><text class="ts" x="82" y="476">403, closed</text><text class="ts" x="82" y="492">no calls made</text></g>

<g class="purple"><rect x="278" y="436" width="120" height="70" rx="8"/><text class="th" x="338" y="454">Turn request</text><text class="ts" x="338" y="476">POST …/turns</text><text class="ts" x="338" y="492">verify token</text></g>
<line class="arr" x1="338" y1="506" x2="338" y2="520" marker-end="url(#arrow)"/>

<g class="purple"><rect x="278" y="520" width="120" height="70" rx="8"/><text class="th" x="338" y="538">Plan</text><text class="ts" x="338" y="560">LangGraph nodes</text><text class="ts" x="338" y="576">classify, plan</text></g>
<polyline class="arr" points="338,590 338,597 470,597 470,604" marker-end="url(#arrow)"/>

<g class="teal"><rect x="412" y="604" width="116" height="70" rx="8"/><text class="th" x="470" y="622">Authorize</text><text class="ts" x="470" y="644">token, ACL, squad</text><text class="ts" x="470" y="660">audit, then read</text></g>
<line class="arr" x1="470" y1="674" x2="470" y2="688" marker-end="url(#arrow)"/>

<g class="teal"><rect x="412" y="688" width="116" height="70" rx="8"/><text class="th" x="470" y="706">Read records</text><text class="ts" x="470" y="728">OpenEMR services</text><text class="ts" x="470" y="744">typed records</text></g>
<polyline class="arr" points="470,758 470,765 338,765 338,772" marker-end="url(#arrow)"/>

<g class="purple"><rect x="278" y="772" width="120" height="70" rx="8"/><text class="th" x="338" y="790">Evidence</text><text class="ts" x="338" y="812">stream: evidence</text><text class="ts" x="338" y="828">records first</text></g>
<polyline class="arr" points="338,842 338,849 588,849 588,856" marker-end="url(#arrow)"/>
<polyline class="arr dash" points="338,849 82,849 82,856" marker-end="url(#arrow)"/>

<g class="gray"><rect x="34" y="856" width="96" height="70" rx="8"/><text class="th" x="82" y="874">Records</text><text class="ts" x="82" y="896">rendered from</text><text class="ts" x="82" y="912">tool output</text></g>

<g class="coral"><rect x="542" y="856" width="92" height="70" rx="8"/><text class="th" x="588" y="874">Narrate</text><text class="ts" x="588" y="896">evidence in</text><text class="ts" x="588" y="912">claims out</text></g>
<polyline class="arr" points="588,926 588,933 338,933 338,940" marker-end="url(#arrow)"/>

<g class="purple"><rect x="278" y="940" width="120" height="70" rx="8"/><text class="th" x="338" y="958">Verify</text><text class="ts" x="338" y="980">check each claim</text><text class="ts" x="338" y="996">repair if needed</text></g>
<line class="arr" x1="338" y1="1010" x2="338" y2="1024" marker-end="url(#arrow)"/>

<g class="purple"><rect x="278" y="1024" width="120" height="70" rx="8"/><text class="th" x="338" y="1042">Render</text><text class="ts" x="338" y="1064">stream: claims</text><text class="ts" x="338" y="1080">withheld count</text></g>
<polyline class="arr" points="338,1094 338,1101 82,1101 82,1108" marker-end="url(#arrow)"/>

<g class="gray"><rect x="34" y="1108" width="96" height="70" rx="8"/><text class="th" x="82" y="1126">Answer</text><text class="ts" x="82" y="1148">claims shown</text><text class="ts" x="82" y="1164">with ref id</text></g>

<line class="arr" x1="30" y1="1215" x2="70" y2="1215" marker-end="url(#arrow)"/>
<text class="lg" x="78" y="1215">next step</text>
<line class="arr dash" x1="170" y1="1215" x2="210" y2="1215" marker-end="url(#arrow)"/>
<text class="lg" x="218" y="1215">streamed to panel or denied</text>
</svg>
