<svg width="680" height="368" viewBox="0 0 680 368" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Horizontally scalable OpenEMR + agent architecture</title>
<desc>An edge load balancer routes by path to two independently scalable tiers, an OpenEMR app tier and an agent tier. The agent tier calls the OpenEMR tier's in-process gateway for tool calls. Both tiers share a MySQL/MariaDB database, a Redis/Valkey store for sessions and agent conversation state, and shared NFS storage for documents.</desc>
<style>
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; dominant-baseline: central; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  .arr { fill: none; stroke: #888780; stroke-width: 1; }
  .gray rect { fill: #F1EFE8; stroke: #5F5E5A; } .gray .th { fill: #444441; } .gray .ts { fill: #5F5E5A; }
  .teal rect { fill: #E1F5EE; stroke: #0F6E56; } .teal .th { fill: #085041; } .teal .ts { fill: #0F6E56; }
  .purple rect { fill: #EEEDFE; stroke: #534AB7; } .purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }
  g rect { stroke-width: 0.5; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="368" fill="#FFFFFF"/>

<!-- Arrows: edge to tiers -->
<line x1="340" y1="96" x2="196" y2="152" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="96" x2="484" y2="152" class="arr" marker-end="url(#arrow)"/>

<!-- Arrow: agent tier -> openemr tier (gateway calls) -->
<line x1="360" y1="184" x2="324" y2="184" class="arr" marker-end="url(#arrow)"/>
<text x="340" y="172" class="ts">gateway calls</text>

<!-- Arrows: openemr tier -> shared backends -->
<line x1="190" y1="212" x2="134" y2="268" class="arr" marker-end="url(#arrow)"/>
<line x1="190" y1="212" x2="308" y2="268" class="arr" marker-end="url(#arrow)"/>
<line x1="190" y1="212" x2="546" y2="268" class="arr" marker-end="url(#arrow)"/>

<!-- Arrow: agent tier -> redis/valkey (shared checkpointer) -->
<line x1="490" y1="212" x2="372" y2="268" class="arr" marker-end="url(#arrow)"/>

<!-- Edge / load balancer -->
<g class="gray">
  <rect x="200" y="40" width="280" height="56" rx="4"/>
  <text x="340" y="57" class="th">Edge / load balancer</text>
  <text x="340" y="79" class="ts">Caddy — path-based routing</text>
</g>

<!-- OpenEMR app tier -->
<g class="teal">
  <rect x="60" y="156" width="260" height="56" rx="4"/>
  <text x="190" y="173" class="th">OpenEMR app tier</text>
  <text x="190" y="195" class="ts">N × docker/binary nodes</text>
</g>

<!-- Agent tier -->
<g class="purple">
  <rect x="360" y="156" width="260" height="56" rx="4"/>
  <text x="490" y="173" class="th">Agent tier</text>
  <text x="490" y="195" class="ts">N × FastAPI/uvicorn nodes</text>
</g>

<!-- Shared backends -->
<g class="gray">
  <rect x="40" y="272" width="180" height="56" rx="4"/>
  <text x="130" y="289" class="th">MySQL / MariaDB</text>
  <text x="130" y="311" class="ts">OpenEMR data</text>
</g>
<g class="gray">
  <rect x="250" y="272" width="180" height="56" rx="4"/>
  <text x="340" y="289" class="th">Redis / Valkey</text>
  <text x="340" y="311" class="ts">Sessions, agent state</text>
</g>
<g class="gray">
  <rect x="460" y="272" width="180" height="56" rx="4"/>
  <text x="550" y="289" class="th">Shared storage</text>
  <text x="550" y="311" class="ts">sites/documents (NFS)</text>
</g>
</svg>
