[project]
name = "agentforge-copilot-agent"
version = "0.3.0"
description = "AgentForge Clinical Co-Pilot agent service: HTTP API, turn graph, verifier, telemetry."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-only" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "anthropic>=1.6",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "aiosqlite>=0.22",
    "langfuse>=4.15,<5",
    "langchain>=1.0",
    "faiss-cpu==1.11.0.post1",
    "huggingface-hub==1.22.0",
    "numpy==2.1.2",
    "onnxruntime==1.22.1",
    "tokenizers==0.22.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "anyio>=4",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]
