# AgentForge Clinical Co-Pilot: fast deterministic checks on every push.
# The offline eval subset runs here (evals/README.md); the Week 2 PR-blocking
# gate is a threshold change here, not new infrastructure.
stages:
  - lint
  - test

lint:whitespace:
  stage: lint
  image:
    name: alpine/git:2.47.2
    entrypoint: [""]  # the image's entrypoint is git itself; the runner needs a shell
  script:
    - git diff-tree --check --root HEAD

lint:php:
  stage: lint
  image: php:8.3-cli-alpine
  script:
    - find interface/modules/custom_modules/oe-module-copilot -name '*.php' -print0 | xargs -0 -n1 php -l

lint:caddy:
  stage: lint
  image: caddy:2.10.2-alpine
  variables:
    PUBLIC_HOSTNAME: example.test
    TLS_EMAIL: ops@example.test
  script:
    - caddy validate --config infra/digitalocean/runtime/Caddyfile --adapter caddyfile

lint:compose:
  stage: lint
  image: docker:27-cli
  variables:
    PUBLIC_HOSTNAME: example.test
    TLS_EMAIL: ops@example.test
  script:
    - cd infra/digitalocean/runtime
    - mkdir -p secrets build/openemr/oe-module-copilot build/agent demo/cohort
    - for s in mysql_root_password mysql_password openemr_admin_password copilot_delegation_secret anthropic_api_key langfuse_public_key langfuse_secret_key; do touch "secrets/$s"; done
    - docker compose config --quiet

test:agent:
  stage: test
  image: python:3.12-slim
  script:
    - cd agent
    # Same order as agent/Dockerfile: the lock first, the package with --no-deps, then the dev
    # extras constrained to the lock so no runtime pin moves.
    - pip install --quiet -r requirements.lock
    - pip install --quiet --no-deps .
    - pip install --quiet -c requirements.lock '.[dev]'
    - pytest -q
    - python -m app.contracts.export --check

# Deterministic eval subset (evals/README.md): the offline cases delegate to
# pytest node ids and need no stack. Live cases run against a deployment with
# `python evals/run.py` and their results are versioned under evals/results/.
test:evals-offline:
  stage: test
  image: python:3.12-slim
  script:
    - cd agent && pip install --quiet -r requirements.lock && pip install --quiet --no-deps . && pip install --quiet -c requirements.lock '.[dev]' && cd ..
    - python evals/run.py --offline-only
  artifacts:
    when: always
    paths:
      - evals/results/
    expire_in: 30 days

# The full suite against the deployment: 45 cases, ~40 model-backed turns, about $0.55 and
# 12 minutes per run. Manual so a push never spends model budget by itself; needs the
# masked CI variable DEMO_PASSWORD (the demo clinician password) set in the project.
test:evals-live:
  stage: test
  image: python:3.12-slim
  when: manual
  allow_failure: false
  variables:
    COPILOT_EVAL_BASE_URL: "https://openemr-137-184-4-22.sslip.io"
  script:
    - test -n "$DEMO_PASSWORD" || { echo "set the masked CI variable DEMO_PASSWORD"; exit 2; }
    - cd agent && pip install --quiet '.[dev]' && cd ..
    - python evals/run.py --base-url "$COPILOT_EVAL_BASE_URL" --label "gitlab-ci $CI_PIPELINE_ID"
  artifacts:
    when: always
    paths:
      - evals/results/
    expire_in: 90 days
