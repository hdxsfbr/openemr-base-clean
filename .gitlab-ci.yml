# AgentForge Clinical Co-Pilot: fast deterministic checks on every push.
# The offline eval subset runs here (evals/README.md); the Week 2 PR-blocking
# gate is a threshold change here, not new infrastructure.
stages:
  - lint
  - test
  - deploy
  - verify

lint:whitespace:
  stage: lint
  image:
    name: alpine/git:2.47.2
    entrypoint: [""]  # the image's entrypoint is git itself; the runner needs a shell
  script:
    - git diff-tree --check --root HEAD

lint:php:
  stage: lint
  image: php:8.3-cli-alpine
  script:
    - find interface/modules/custom_modules/oe-module-copilot -name '*.php' -print0 | xargs -0 -n1 php -l

lint:caddy:
  stage: lint
  image: caddy:2.10.2-alpine
  variables:
    PUBLIC_HOSTNAME: example.test
    TLS_EMAIL: ops@example.test
  script:
    - caddy validate --config infra/digitalocean/runtime/Caddyfile --adapter caddyfile

lint:compose:
  stage: lint
  image: docker:27-cli
  variables:
    PUBLIC_HOSTNAME: example.test
    TLS_EMAIL: ops@example.test
  script:
    - cd infra/digitalocean/runtime
    - mkdir -p secrets build/openemr/oe-module-copilot build/agent demo/cohort
    - for s in mysql_root_password mysql_password openemr_admin_password copilot_delegation_secret anthropic_api_key langfuse_public_key langfuse_secret_key; do touch "secrets/$s"; done
    - docker compose config --quiet

test:agent:
  stage: test
  image: python:3.12-slim
  script:
    - cd agent
    # Same order as agent/Dockerfile: the lock first, the package with --no-deps, then the dev
    # extras constrained to the lock so no runtime pin moves.
    - pip install --quiet -r requirements.lock
    - pip install --quiet --no-deps .
    - pip install --quiet -c requirements.lock '.[dev]'
    - pytest -q
    - python -m app.contracts.export --check

# Deterministic eval subset (evals/README.md): the offline cases delegate to
# pytest node ids and need no stack. Live cases run against a deployment with
# `python evals/run.py` and their results are versioned under evals/results/.
test:evals-offline:
  stage: test
  image: python:3.12-slim
  script:
    - cd agent && pip install --quiet -r requirements.lock && pip install --quiet --no-deps . && pip install --quiet -c requirements.lock '.[dev]' && cd ..
    - python evals/run.py --offline-only
  artifacts:
    when: always
    paths:
      - evals/results/
    expire_in: 30 days

# Slice 1's release starter is deliberately separate from the Week 1 offline
# subset: these are the eight PRD-shaped lab boundaries that must be green for
# every merge request touching the candidate. The report lists only case IDs,
# Boolean rubrics, stable test node IDs, and verdicts; no fixture or preview
# content is preserved as a CI artifact.
test:evals-slice1-starter:
  stage: test
  image: python:3.12-slim
  script:
    - cd agent && pip install --quiet -r requirements.lock && pip install --quiet --no-deps . && pip install --quiet -c requirements.lock '.[dev]' && cd ..
    - python evals/run_slice1_starter.py --output evals/artifacts/slice1-starter.json
  artifacts:
    when: always
    paths:
      - evals/artifacts/slice1-starter.json
    expire_in: 90 days

# Slice 2 runs the original eight lab cases plus the intake-specific negative
# paths, so shared-pipeline changes cannot pass by testing just one type.
test:evals-slice2-shared:
  stage: test
  image: python:3.12-slim
  script:
    - cd agent && pip install --quiet -r requirements.lock && pip install --quiet --no-deps . && pip install --quiet -c requirements.lock '.[dev]' && cd ..
    - python evals/run_slice2_gate.py --output evals/artifacts/slice2-shared-gate.json
  artifacts:
    when: always
    paths:
      - evals/artifacts/slice2-shared-gate.json
    expire_in: 90 days

# Deploys HEAD of main to the single Droplet (137.184.4.22) every push, automatically:
# the owner decided (2026-09-17) that the early submission is already graded and the
# priority now is deploying continuously rather than saving one push for M5. This
# reverses the "never deploy without explicit approval" default the rest of the plan
# still uses for terraform apply / destroy / load tests / the release run -- those
# stay human-gated; only this one script, run against this one Droplet, is now
# unattended. Needs the protected CI/CD variables DEPLOY_SSH_PRIVATE_KEY (file type;
# the public half must be appended by hand to ~/.ssh/authorized_keys for the deployer
# user on the Droplet -- the CI runner cannot do this itself) and TLS_EMAIL.
# push-secrets.sh (inside deploy.sh) finds no ~/.config/agentforge/ on the runner and
# skips every secret push, so it never overwrites the operator-pushed model/tracer
# keys already on the host.
# Manual since 2026-09-20 (was automatic on every push to main from
# 2026-09-17 until then): a docs-only push no longer redeploys the live
# Droplet. Trigger it by hand from the pipeline view when a runtime change
# actually needs shipping.
deploy:production:
  stage: deploy
  image: alpine:3.21
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: manual
      allow_failure: true
  before_script:
    - apk add --no-cache openssh-client bash
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$DEPLOY_SSH_PRIVATE_KEY" ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
  script:
    - test "$TLS_EMAIL" != "CHANGE_ME@example.com" || { echo "set the real TLS_EMAIL CI/CD variable"; exit 2; }
    - bash infra/digitalocean/deploy.sh 137.184.4.22 openemr-137-184-4-22.sslip.io "$TLS_EMAIL"
  environment:
    name: production
    url: https://openemr-137-184-4-22.sslip.io

# Cheap, no-secret liveness check right after every deploy: OpenEMR itself plus the
# agent's own /ready detail (informational -- a tracer or gateway hiccup here is a
# real finding to look at, not proof the deploy failed, so it never fails the job).
verify:smoke:
  stage: verify
  image: alpine:3.21
  needs:
    - job: "deploy:production"
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: on_success
  before_script:
    - apk add --no-cache bash curl
  script:
    - bash infra/digitalocean/smoke.sh openemr-137-184-4-22.sslip.io
    - curl -sS --max-time 20 https://openemr-137-184-4-22.sslip.io/copilot-api/ready || true

# The full suite against the deployment: 48 cases, ~42 model-backed turns, about $0.47 and
# 12-13 minutes per run. Manual so a push never spends model budget by itself. Since
# deploy:production is also manual (2026-09-20), this exercises whatever is currently
# live, not necessarily the commit just pushed -- trigger deploy:production first if
# the two need to match. Needs the masked CI variable DEMO_PASSWORD (the demo clinician
# password).
test:evals-live:
  stage: verify
  image: python:3.12-slim
  when: manual
  allow_failure: true
  variables:
    COPILOT_EVAL_BASE_URL: "https://openemr-137-184-4-22.sslip.io"
  script:
    - test -n "$DEMO_PASSWORD" || { echo "set the masked CI variable DEMO_PASSWORD"; exit 2; }
    - cd agent && pip install --quiet -r requirements.lock && pip install --quiet --no-deps . && pip install --quiet -c requirements.lock '.[dev]' && cd ..
    - python evals/run.py --base-url "$COPILOT_EVAL_BASE_URL" --label "gitlab-ci $CI_PIPELINE_ID"
  artifacts:
    when: always
    paths:
      - evals/results/
    expire_in: 90 days
