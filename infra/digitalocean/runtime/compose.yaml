name: agentforge-openemr

services:
  database:
    image: mariadb:11.8.8@sha256:24e76fcec8c003a0362d0dd53f4806e7e79458d7fdeaf47437760e19496f5a9c
    restart: unless-stopped
    command:
      - mariadbd
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    environment:
      MARIADB_DATABASE: openemr
      MARIADB_USER: openemr
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MARIADB_PASSWORD_FILE: /run/secrets/mysql_password
    secrets:
      - mysql_root_password
      - mysql_password
    volumes:
      - database_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      start_period: 60s
      interval: 30s
      timeout: 5s
      retries: 5

  openemr:
    # Project image: pinned upstream release plus the co-pilot module (built on the host by start.sh).
    image: agentforge/openemr:local
    build:
      context: ./build/openemr
      dockerfile: Dockerfile
      args:
        OPENEMR_BASE: ${OPENEMR_IMAGE:-openemr/openemr:8.1.1@sha256:796adaa7b3d03c76902e9afd2c1b420afc39f040425a68d4aefdf4ace285fa0b}
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - /run/config/openemr-entrypoint.sh
    command:
      - ./openemr.sh
    environment:
      MYSQL_HOST: database
      MYSQL_DATABASE: openemr
      MYSQL_USER: openemr
      OE_USER: challenge-admin
    secrets:
      - mysql_root_password
      - mysql_password
      - openemr_admin_password
      - copilot_delegation_secret
    volumes:
      - openemr_sites:/var/www/localhost/htdocs/openemr/sites
      - openemr_logs:/var/log
      - openemr_ssl:/etc/ssl
      - ./openemr-entrypoint.sh:/run/config/openemr-entrypoint.sh:ro
    networks:
      - frontend
      - backend
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /usr/bin/curl
        - --fail
        - --insecure
        - --location
        - --show-error
        - --silent
        - https://localhost/meta/health/livez
      start_period: 180s
      interval: 30s
      timeout: 5s
      retries: 5

  # One-shot: register and enable the co-pilot module and apply its SQL.
  # Runs after OpenEMR is healthy: docker compose --profile setup run --rm copilot-setup
  copilot-setup:
    image: agentforge/openemr:local
    profiles:
      - setup
    entrypoint:
      - /bin/sh
      - -c
    command:
      - cd /var/www/localhost/htdocs/openemr && su -s /bin/sh apache -c "php interface/modules/custom_modules/oe-module-copilot/bin/register_module.php"
    volumes:
      - openemr_sites:/var/www/localhost/htdocs/openemr/sites
    networks:
      - backend
    depends_on:
      openemr:
        condition: service_healthy

  # One-shot demo seeding (AUDIT.md section 7.2): synthetic cohort from a read-only
  # bind mount outside the web root; never inside the image.
  # docker compose --profile demo run --rm demo-seed
  demo-seed:
    image: agentforge/openemr:local
    profiles:
      - demo
    entrypoint:
      - /bin/sh
      - -c
    command:
      - cd /var/www/localhost/htdocs/openemr && su -s /bin/sh apache -c "OPENEMR_ROOT=/var/www/localhost/htdocs/openemr DEMO_USER_PASSWORD_FILE=/run/secrets/demo_user_password php /opt/copilot-demo/cohort/seed_users.php --confirm-dev-data && OPENEMR_ROOT=/var/www/localhost/htdocs/openemr php /opt/copilot-demo/cohort/seed_cohort.php --confirm-dev-data --anchor=${DEMO_ANCHOR:-2026-09-15}"
    environment:
      DEMO_ANCHOR: ${DEMO_ANCHOR:-2026-09-15}
    secrets:
      - demo_user_password
    volumes:
      - openemr_sites:/var/www/localhost/htdocs/openemr/sites
      - ./demo/cohort:/opt/copilot-demo/cohort:ro
    networks:
      - backend
    depends_on:
      openemr:
        condition: service_healthy

  # Agent service (ADR-0003, ADR-0004): frontend network only, so no route to the
  # database; the model key and delegation secret are file secrets here.
  agent:
    image: agentforge/copilot-agent:local
    build:
      context: ./build/agent
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      COPILOT_GATEWAY_PING_URL: http://openemr:80/interface/modules/custom_modules/oe-module-copilot/public/gateway/ping.php
      COPILOT_STATE_DIR: /var/lib/copilot
    secrets:
      - anthropic_api_key
      - copilot_delegation_secret
      - langfuse_public_key
      - langfuse_secret_key
    volumes:
      - agent_state:/var/lib/copilot
    networks:
      - frontend
    depends_on:
      openemr:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).status == 200 else 1)"
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?set PUBLIC_HOSTNAME in .env}
      TLS_EMAIL: ${TLS_EMAIL:?set TLS_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
    depends_on:
      openemr:
        condition: service_healthy
      agent:
        condition: service_started

secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password
  mysql_password:
    file: ./secrets/mysql_password
  openemr_admin_password:
    file: ./secrets/openemr_admin_password
  copilot_delegation_secret:
    file: ./secrets/copilot_delegation_secret
  demo_user_password:
    file: ./secrets/demo_user_password
  anthropic_api_key:
    file: ./secrets/anthropic_api_key
  langfuse_public_key:
    file: ./secrets/langfuse_public_key
  langfuse_secret_key:
    file: ./secrets/langfuse_secret_key

volumes:
  database_data:
  openemr_sites:
  openemr_logs:
  openemr_ssl:
  agent_state:
  caddy_data:
  caddy_config:

networks:
  frontend:
  backend:
    internal: true
