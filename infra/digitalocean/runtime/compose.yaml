name: agentforge-openemr

# Container logs were unbounded on a host up since 2026-09-15; every service
# below aliases this so the Docker daemon rotates them (30 MiB per container).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  database:
    image: mariadb:11.8.8@sha256:24e76fcec8c003a0362d0dd53f4806e7e79458d7fdeaf47437760e19496f5a9c
    logging: *default-logging
    restart: unless-stopped
    command:
      - mariadbd
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    environment:
      MARIADB_DATABASE: openemr
      MARIADB_USER: openemr
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MARIADB_PASSWORD_FILE: /run/secrets/mysql_password
    secrets:
      - mysql_root_password
      - mysql_password
    volumes:
      - database_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      start_period: 60s
      interval: 30s
      timeout: 5s
      retries: 5

  openemr:
    # Project image: pinned upstream release plus the co-pilot module (built on the host by start.sh).
    image: agentforge/openemr:local
    logging: *default-logging
    build:
      context: ./build/openemr
      dockerfile: Dockerfile
      args:
        OPENEMR_BASE: ${OPENEMR_IMAGE:-openemr/openemr:8.1.1@sha256:796adaa7b3d03c76902e9afd2c1b420afc39f040425a68d4aefdf4ace285fa0b}
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - /run/config/openemr-entrypoint.sh
    command:
      - ./openemr.sh
    environment:
      MYSQL_HOST: database
      MYSQL_DATABASE: openemr
      MYSQL_USER: openemr
      OE_USER: challenge-admin
      # Every container here runs UTC, deliberately, and nothing sets TZ.
      # Setting the clinic clock on this service alone split one datetime column
      # across two clocks: OpenEMR re-points the MySQL session at PHP's offset per
      # request (interface/globals.php), so rows written afterwards were seven
      # hours behind every earlier row, and conversation resume started returning
      # a stale transcript (ISO-RECENT-PATIENT-RESUME-001). A real clinic does need
      # its own day -- see the Known Limitations note -- but it needs it on every
      # container that writes a date, openemr, database, demo-seed, copilot-setup
      # and the agent together, not on one of them.
      # When the panel prepares the UC-01 brief for a chart being opened, instead of
      # waiting to be asked (BriefPolicy): always | visit_today | off.
      # The module's own default is `visit_today`, which is the product decision
      # (ADR-0003 amendment): spend only on a patient being seen today. This
      # deployment overrides it to `always` on purpose, because it is a demo box
      # whose cohort carries whatever schedule was last seeded, and a walkthrough
      # has to show the brief on whichever chart is opened.
      COPILOT_BRIEF_ON_OPEN: ${COPILOT_BRIEF_ON_OPEN:-always}
    secrets:
      - mysql_root_password
      - mysql_password
      - openemr_admin_password
      - copilot_delegation_secret
    volumes:
      - openemr_sites:/var/www/localhost/htdocs/openemr/sites
      - openemr_logs:/var/log
      - openemr_ssl:/etc/ssl
      - ./openemr-entrypoint.sh:/run/config/openemr-entrypoint.sh:ro
    networks:
      - frontend
      - backend
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /usr/bin/curl
        - --fail
        - --insecure
        - --location
        - --show-error
        - --silent
        - https://localhost/meta/health/livez
      start_period: 180s
      interval: 30s
      timeout: 5s
      retries: 5

  # One-shot: register and enable the co-pilot module and apply its SQL.
  # Runs after OpenEMR is healthy: docker compose --profile setup run --rm copilot-setup
  copilot-setup:
    image: agentforge/openemr:local
    logging: *default-logging
    profiles:
      - setup
    entrypoint:
      - /bin/sh
      - -c
    command:
      - cd /var/www/localhost/htdocs/openemr && su -s /bin/sh apache -c "php interface/modules/custom_modules/oe-module-copilot/bin/register_module.php"
    volumes:
      - openemr_sites:/var/www/localhost/htdocs/openemr/sites
    networks:
      - backend
    depends_on:
      openemr:
        condition: service_healthy

  # One-shot demo seeding (AUDIT.md section 7.2): synthetic cohort from a read-only
  # bind mount outside the web root; never inside the image.
  # docker compose --profile demo run --rm demo-seed
  demo-seed:
    image: agentforge/openemr:local
    logging: *default-logging
    profiles:
      - demo
    entrypoint:
      - /bin/sh
      - -c
    command:
      - cd /var/www/localhost/htdocs/openemr && su -s /bin/sh apache -c "OPENEMR_ROOT=/var/www/localhost/htdocs/openemr DEMO_USER_PASSWORD_FILE=/run/secrets/demo_user_password php /opt/copilot-demo/cohort/seed_users.php --confirm-dev-data && OPENEMR_ROOT=/var/www/localhost/htdocs/openemr php /opt/copilot-demo/cohort/seed_cohort.php --confirm-dev-data --anchor=${DEMO_ANCHOR:-2026-09-15}"
    environment:
      DEMO_ANCHOR: ${DEMO_ANCHOR:-2026-09-15}
    secrets:
      - demo_user_password
    volumes:
      - openemr_sites:/var/www/localhost/htdocs/openemr/sites
      - ./demo/cohort:/opt/copilot-demo/cohort:ro
    networks:
      - backend
    depends_on:
      openemr:
        condition: service_healthy

  # Agent service (ADR-0003, ADR-0004): frontend network only, so no route to the
  # database; the model key and delegation secret are file secrets here.
  agent:
    image: agentforge/copilot-agent:local
    logging: *default-logging
    build:
      context: ./build/agent
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      COPILOT_GATEWAY_BASE_URL: http://openemr:80/interface/modules/custom_modules/oe-module-copilot/public/gateway
      COPILOT_GATEWAY_PING_URL: http://openemr:80/interface/modules/custom_modules/oe-module-copilot/public/gateway/ping.php
      COPILOT_STATE_DIR: /var/lib/copilot
      # No TZ, for the same reason as openemr above: `date.today()` here decides
      # which encounter counts as "the last visit" for the UC-01 window, and it has
      # to mean the same day the database means. Log timestamps were always UTC with
      # an explicit `Z` (`logging_setup.py`), which is what correlates with Langfuse
      # and the gateway's audit rows.
      # Model for narration and planning (ADR-0004: claude-sonnet-5, accepted 2026-09-15 on measured latency).
      COPILOT_MODEL_ID: ${COPILOT_MODEL_ID:-claude-sonnet-5}
      # Optional override for the plan call only; empty falls back to COPILOT_MODEL_ID
      # (2026-09-18 per-node model experiment, not yet adopted -- see AI_COST_ANALYSIS.md).
      COPILOT_PLAN_MODEL_ID: ${COPILOT_PLAN_MODEL_ID:-}
      # Set false alongside a plan_model_id override to a model outside the
      # Claude 5 family -- output_config.effort 400s on e.g. Haiku 4.5.
      COPILOT_PLAN_MODEL_SUPPORTS_EFFORT: ${COPILOT_PLAN_MODEL_SUPPORTS_EFFORT:-true}
      # Follow-up plan->retrieve rounds per turn (ADR-0004 decision 5, amended
      # 2026-09-18: 3 -> 1 -- p95 down 35%, cost down 23%, 46/46 eval cases,
      # no quality regression found; see docs/audit/evidence/performance/
      # model-experiments-2026-09-18.md).
      COPILOT_MAX_PLAN_ROUNDS: ${COPILOT_MAX_PLAN_ROUNDS:-1}
      # Demo deployment only: honors X-Copilot-Fault for the collection's failure examples.
      COPILOT_FAULT_INJECTION: ${COPILOT_FAULT_INJECTION:-1}
      # Full model exchanges (prompts, evidence pack, raw output, final answer) on the
      # Langfuse traces instead of digests, for error analysis and eval data. The tracer
      # is treated as inside the compliance boundary (ADR-0007 amendment 2026-09-19);
      # set 0 to restore the PHI-free digest mask.
      COPILOT_TRACE_CONTENT: ${COPILOT_TRACE_CONTENT:-1}
    # The agent runs as uid 10001; start.sh makes these four host files 0644
    # (Compose file secrets keep the host mode; `mode` is swarm-only).
    secrets:
      - anthropic_api_key
      - anthropic_workspace_id
      - copilot_delegation_secret
      - langfuse_public_key
      - langfuse_secret_key
    volumes:
      - agent_state:/var/lib/copilot
    networks:
      - frontend
    depends_on:
      openemr:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).status == 200 else 1)"
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3

  # PRD runtime alerts (docs/operations/alerts.md): the evaluator loops every
  # 300 s over the agent's /metrics and /ready, keeping the previous sample on
  # the agent state volume for rate math. Same image as the agent (no build
  # key: `docker compose build agent` in start.sh produces it). The inherited
  # Dockerfile HEALTHCHECK probes :8080, which this process never serves, so
  # it is disabled here; otherwise `up --wait` in start.sh would stall.
  alerts:
    image: agentforge/copilot-agent:local
    logging: *default-logging
    restart: unless-stopped
    command:
      - python
      - -m
      - app.alerts
      - --url
      - http://agent:8080/metrics
      - --ready-url
      - http://agent:8080/ready
      - --state
      - /var/lib/copilot/alerts-state.json
      - --interval
      - "300"
    volumes:
      - agent_state:/var/lib/copilot
    networks:
      - frontend
    depends_on:
      agent:
        condition: service_healthy
    healthcheck:
      disable: true

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    logging: *default-logging
    restart: unless-stopped
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?set PUBLIC_HOSTNAME in .env}
      TLS_EMAIL: ${TLS_EMAIL:?set TLS_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
    depends_on:
      openemr:
        condition: service_healthy
      agent:
        condition: service_started

secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password
  mysql_password:
    file: ./secrets/mysql_password
  openemr_admin_password:
    file: ./secrets/openemr_admin_password
  copilot_delegation_secret:
    file: ./secrets/copilot_delegation_secret
  demo_user_password:
    file: ./secrets/demo_user_password
  anthropic_api_key:
    file: ./secrets/anthropic_api_key
  anthropic_workspace_id:
    file: ./secrets/anthropic_workspace_id
  langfuse_public_key:
    file: ./secrets/langfuse_public_key
  langfuse_secret_key:
    file: ./secrets/langfuse_secret_key

volumes:
  database_data:
  openemr_sites:
  openemr_logs:
  openemr_ssl:
  agent_state:
  caddy_data:
  caddy_config:

networks:
  frontend:
  backend:
    internal: true
